# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/tutorials/build-and-test-code/nodejs

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildAndTest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
          - 24
          - 26
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - name: Install Dependencies
      run: npm ci
    - name: Linting
      run: npm run eslint
    - name: Running Typescript
      run: npm run build
    - name: Running Typescript Declaration
      run: npm run build:declaration
    - name: Unit Testing
      run: npm run mocha:unit
    - name: Integration Testing
      run: npm run mocha:int
